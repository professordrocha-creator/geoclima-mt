{% extends "base.html" %}
{% block title %}Confirmar exclusão — MonitorChuva MT{% endblock %}
{% block content %}
<div class="card-auth text-center">
    <h1><i class="fas fa-triangle-exclamation text-danger"></i> Confirmar Exclusão</h1>
    <p>Tem certeza que deseja excluir o lançamento de <strong>{{ objeto.date }}</strong> ({{ objeto.value }} mm)?</p>
    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger flex-fill">Sim, excluir</button>
            <a href="{% url 'climate:lista_lancamentos' %}" class="btn btn-outline-secondary flex-fill">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
