{% extends "base.html" %}
{% block title %}Recuperar senha — GeoClima MT{% endblock %}
{% block content %}
<div class="card-auth">
    <h1><i class="fas fa-key"></i> Recuperar Senha</h1>
    <p class="text-muted small mb-3">
        Informe o e-mail cadastrado. Vamos enviar um link para redefinir sua senha.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_email" class="form-label">E-mail</label>
            <input type="email" name="email" id="id_email" class="form-control" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Enviar link de recuperação</button>
    </form>
    <div class="links-auxiliares">
        <a href="{% url 'accounts:login' %}">Voltar ao login</a>
    </div>
</div>
{% endblock %}
