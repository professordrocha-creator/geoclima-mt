{% extends "base.html" %}
{% block title %}Login — MonitorChuva MT{% endblock %}
{% block content %}
<div class="card-auth">
    <h1><i class="fas fa-lock"></i> Acessar Painel</h1>

    {% if form.errors %}
        <div class="alert alert-danger alert-erro-form" role="alert">
            Usuário ou senha inválidos. Tente novamente.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_username" class="form-label">Usuário</label>
            <input type="text" name="username" id="id_username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="id_password" class="form-label">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <div class="links-auxiliares">
        <a href="{% url 'accounts:password_reset' %}">Esqueci minha senha</a>
        <span class="text-muted"> · </span>
        <a href="{% url 'accounts:registro' %}">Criar uma conta</a>
    </div>
</div>
{% endblock %}
